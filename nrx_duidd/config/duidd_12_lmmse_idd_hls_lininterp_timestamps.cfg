#
# IDD [12] + LMMSE chest, untrained (paper-default IDD coeffs).
# Covariance from estimate_hls_from_datalake.py (Pixel LS + lag/Toeplitz).
# Pair with: duidd_12_lmmse_idd_umi.cfg (same PHY, compute_cov_mat UMi cov).
#
# Eval (no training):
#   python eval_duidd_from_datalake.py --config-name duidd_12_lmmse_idd_hls.cfg \
#       --idd-only --db 8 --limit 100 --timestamps slot.pkl
# Cov mats: ../weights/duidd_12_lmmse_idd_hls_{space,time,freq}_cov_mat.npy
#   (produced by estimate_hls_from_datalake.py; default --save-prefix matches this label)

[global]
label = 'duidd_12_lmmse_idd_hls_lininterp_timestamps'
ebno = True

[system]
n_size_bwp = 273
num_rx_antennas = 4
mcs_index = [10]
mcs_table = 2
carrier_frequency = 2140000000.0
subcarrier_spacing = 30000.0
n_start_grid = 0
slot_number = 14
frame_number = 0
cyclic_prefix = 'normal'
precoding = 'non-codebook'
n_cell_id = 51
tpmi = 2
symbol_allocation = [0, 13]
num_antenna_ports = 2
dmrs_mapping_type = "B"
dmrs_config_type = 1
dmrs_type_a_position = 2
dmrs_additional_position = 2
dmrs_length = 1
dmrs_nid = [[51, 51], [51, 51]]
n_scid = 0
num_cdm_groups_without_data = 2
verbose = False
dmrs_port_sets = [[0, 2]]
n_rntis = [9304, 9304]
n_ids = [51, 51]
num_layers = 2

[baseline]
demapping_type = 'maxlog'
num_bp_iter = 12
cn_type = 'minsum'
lmmse_num_prbs = -1

num_nrx_iter = 0
num_nrx_iter_eval = 0
max_num_tx = 1
min_num_tx = 1
initial_chest = "ls"
custom_constellation = False
mask_pilots = False

[duidd]
chest = "lmmse"
duidd_schedule = [12]
low_complexity_mmse_pic = False
weighted_bp = False

[training]
# Unused for --idd-only eval; kept for Parameters compatibility.
training_schedule = {
    "num_iter": [1],
    "learning_rate": [0.001],
    "batch_size": [8],
    "train_tx": [False],
    "min_training_snr_db": [[0., 0.]],
    "max_training_snr_db": [[10., 10.]],
    "double_readout": [False],
    "apply_multiloss": [False],
    "weighting_double_readout": [0.01],
    "loss_fun_name": ["bce"]}

num_iter_train_save = 1000
max_ut_velocity = 56.
min_ut_velocity = 0.
channel_norm = False
cfo_offset_ppm = 0.0
channel_type = 'UMi'
eval_ebno_db_arr = [10.0]
xla = False
tfrecord_filename = "na"
loss_fun_name = "bce"

[evaluation]
snr_db_eval_min = -2
snr_db_eval_max = 8
snr_db_eval_stepsize = 1
max_ut_velocity_eval = 56
min_ut_velocity_eval = 56
cfo_offset_ppm_eval = 0.0
tfrecord_filename_eval = "na"
channel_type_eval = "UMi"
channel_norm_eval = False
n_size_bwp_eval = 273
batch_size_eval = 8
batch_size_eval_small = 2
